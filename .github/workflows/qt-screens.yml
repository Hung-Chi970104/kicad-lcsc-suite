# Render every LCSC Suite screen offscreen and fail if any of them raises.
#
# This is the migration's safety net. Qt renders with no display, no window
# manager and no screen-recording permission, so the same command a developer
# runs locally works unchanged here — and because the style is forced to Fusion
# with explicit font sizes, a screen that renders on Linux renders the same on
# macOS and Windows.
#
# The job does two things a unit test cannot:
#
#   1. builds every screen, so a layout change that throws (a missing attribute,
#      a model that returns the wrong column count) fails loudly instead of
#      waiting for someone to open that dialog;
#   2. checks the committed PNGs are up to date, so a UI change cannot land
#      without its screenshot. That is the rule the whole migration rests on.
name: Qt screens

on:
  push:
    paths:
      - "lcsc_suite/**"
      # The Qt app reads the icon set and the shared logic modules out of the
      # legacy package, so a change there can alter what renders.
      - "kicad_lcsc_suite/**"
      - "scripts/qt_probe.py"
      - "docs/screens/**"
      - ".github/workflows/qt-screens.yml"
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app's dependencies
        # See the note on the `test` job: the hand-listed set drifted and this
        # job had never once passed. `requests` arrives through `pip install
        # -e .` — the Qt app reaches the legacy package's library.py through
        # shared.py, and that module imports it at the top.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "PySide6>=6.7,<7" "kicad-python>=0.4,<1" pytest

      - name: Install the libraries Qt's offscreen platform still needs
        # Even offscreen, Qt links against xkbcommon and a handful of X client
        # libraries. Without these the platform plugin fails to load and every
        # screen "raises" for a reason that has nothing to do with our code.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Render every screen, light and dark
        run: python scripts/qt_probe.py --all --theme both --out /tmp/screens

      - name: Check the committed screenshots are up to date
        # A UI change that alters a screen must update its PNG in the same
        # commit, so the diff shows the visual change. Compare structurally
        # rather than byte-for-byte: font rasterisation differs between the
        # runner and a developer's machine, which would make this a permanent
        # false failure.
        #
        # TOLERANCE exists because a screen that does not call resize() takes
        # its size from its contents, and its contents are text. The first
        # green run measured exactly that: 34 of 38 screens matched macOS to
        # the pixel, and the four that did not were assign-dialog (Δ3px) and
        # export-summary (Δ11px) — the two dialogs that size themselves. A
        # missing PNG stays a hard failure; only the size gets a budget.
        run: |
          python - <<'PY'
          import os, sys
          TOLERANCE = 16
          committed, rendered = "docs/screens", "/tmp/screens"
          missing, wrong_size = [], []
          for name in sorted(os.listdir(rendered)):
              if not name.endswith(".png"):
                  continue
              target = os.path.join(committed, name)
              if not os.path.isfile(target):
                  missing.append(name)
                  continue
              from PySide6.QtGui import QImage
              a, b = QImage(target), QImage(os.path.join(rendered, name))
              if (abs(a.width() - b.width()) > TOLERANCE
                      or abs(a.height() - b.height()) > TOLERANCE):
                  wrong_size.append(f"{name}: committed {a.size()}, rendered {b.size()}")
          if missing:
              print("Screens with no committed PNG — run scripts/qt_probe.py and commit:")
              for name in missing:
                  print(f"  docs/screens/{name}")
          if wrong_size:
              print(f"Screens more than {TOLERANCE}px from their committed PNG:")
              for line in wrong_size:
                  print(f"  {line}")
          sys.exit(1 if missing or wrong_size else 0)
          PY

      - name: Upload the rendered screens
        # Always, so a failing run can be looked at rather than guessed at.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-screens
          path: /tmp/screens

  # ---------------------------------------------------------------------------
  # Windows. §7 of the migration plan asks for "one real Windows pass per phase"
  # and it was never once run — it is the single claim this whole migration
  # rests on that had no evidence behind it. Doing it by hand per phase is what
  # made it never happen, so it is a job.
  #
  # It compares *geometry*, not pixels. Pixels cannot work: the app forces
  # Fusion and states its font size, but not a font *family*, so text renders in
  # Segoe UI here and in the system face on macOS. Those are different faces and
  # they rasterise differently — a pixel gate would fail forever for a reason
  # that is not a bug.
  #
  # What geometry does check is the part that must not differ: the widget tree,
  # every window's own size, and how far text metrics push each control around.
  # See scripts/compare_geometry.py for why those three are graded separately.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "PySide6>=6.7,<7" "kicad-python>=0.4,<1" pytest

      - name: Render every screen, light and dark
        run: python scripts/qt_probe.py --all --theme both --out screens-windows --geometry-out geometry-windows.txt

      - name: Compare the layout against the committed macOS reference
        run: python scripts/compare_geometry.py docs/screens/geometry.txt geometry-windows.txt --reference-name macos --compared-name windows

      - name: Upload the Windows screens and geometry
        # Always: a failing comparison is a thing to look at, not to guess at,
        # and the PNGs are the only way to see what the numbers mean.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-screens-windows
          path: |
            screens-windows
            geometry-windows.txt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # `pip install -e .` rather than a hand-listed set. The hand-listed one
        # drifted: tests/test_componentdb.py reaches into db_build, whose
        # jlcapi imports cachetools, and this job had been failing on that since
        # the Phase 2 commit without anybody noticing — which means CI was not a
        # gate at all for six phases. pyproject already declares what db_build
        # needs, so the list cannot drift again if it is not a list.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff==0.14.14 "PySide6>=6.7,<7"

      - name: Install the libraries Qt needs to import at all
        # The suite builds real widgets, so importing PySide6 has to succeed
        # here for the same reason it does in the render job — `libEGL.so.1` is
        # loaded when the QtGui module is imported, offscreen or not.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: pytest
        # Nothing under tests/ imports wx, so the whole suite runs on a bare
        # Python — it is the safety net for the logic half through every phase.
        run: python -m pytest -q
      - name: ruff
        run: |
          ruff check --extend-exclude=lib
